<div
  class="navbar-container"
  [class.hidden]="isHidden()"
  [class.darkmode]="isDarkmode()"
>
  @for (item of navItems; track item.id) {
    <div
      class="navbar-item"
      [class.active]="activeSection() === item.id"
      (click)="scrollTo(item.id)"
    >
      {{ item.label }}
    </div>
  }
</div>
