<div class="hero-container">
  <div
    #content
    class="inner-container"
    (mousemove)="onMove($event)"
    (mouseleave)="onLeave()"
  >
    <div class="text-container" appParallax="down">
      <div class="text-primary name">Hi, I'm Reinhard 👋</div>
      <div class="text-secondary description">
        a <span class="text-primary role">Software Developer</span> crafting
        full-stack applications with a focus on UI/UX
      </div>
      <div class="text-secondary hover-caption" [class.visible]="hoverCaption">
        <span
          *ngFor="let char of hoverCaptionChars; let i = index"
          class="hover-caption-char"
          [style.animation-delay.ms]="i * 30"
          >{{ char === " " ? "\u00A0" : char }}</span
        >
      </div>
    </div>
    <div #cursor class="cursor-face">
      @for (photo of photos; track photo; let i = $index) {
        <div
          class="polaroid"
          [style.--pos]="position(i)"
          [style.--tilt]="tilts[i] + 'deg'"
          [class.flying-out]="flyingOut && position(i) === 0"
        >
          <img [src]="photo.img" alt="" aria-hidden="true" />
          <div class="caption">{{ photo.caption }}</div>
        </div>
      }
    </div>

    <div class="text-primary scroll-text">
      View work
      <div class="arrow">↓</div>
    </div>
  </div>
</div>
